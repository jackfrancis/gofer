# Dev overlay for `make dev-up`: gofer's application base plus the dispatch
# registration its selected agent-runtime backend needs. It assumes AEI is already
# installed on the cluster (the agents.x-k8s.io CRDs, the aei-controller in aei-system,
# and an AgentProviderClass — see agentapp.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - agentapp.yaml
