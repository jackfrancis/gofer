# gofer's AEI dispatch registration (see the AEI hello-world walkthrough). One
# long-lived object: the web tier's ServiceAccount ("gofer") may dispatch runs as
# this app, bringing its OWN runtime image and bounded by the scopes below, onto a
# generic (admin-owned) provider class.
#
# Requires (installed on the AEI side, NOT by gofer):
#   - the agents.x-k8s.io CRDs and the aei-controller (namespace aei-system)
#   - the aei-controller's signing authority provisioned: AEI owns the keypair as
#     the sole minter (`make authority` on the AEI side); gofer's verify-only web
#     tier holds ONLY the public half (MINT_PUBLIC_KEY = AEI's public key, from
#     `make public-key` / GET /aei/v1alpha1/authority) and feeds AEI nothing (ADR 0002)
#   - a provider class bound to the k8s-job provider with controlURL =
#     http://aei-controller.aei-system.svc:8080/aei/v1alpha1. The runtime image is
#     app-supplied (below), so the class is generic, not gofer-specific.
#   - to enable LLM ranking, set gofer's chat-model token (AI_TOKEN) in the
#     gofer-secrets Secret: the web tier brokers it to each runtime per run
#     (provider "ai"), so no model secret lives in the sandbox. Unset means the
#     runtime falls back to the deterministic stub ranker.
#
# This is gofer's app-side AEI contract: the web tier dispatches every run to the
# controller as this app, holds no minting key, and brings its own image.
apiVersion: agents.x-k8s.io/v1alpha1
kind: AgentApp
metadata:
  name: gofer
  namespace: gofer
spec:
  # The well-known, admin-published AgentProviderClass name this app's runs dispatch
  # to (cluster-scoped, admin-owned). This is the committed default; `make dev-up`
  # overrides it with AGENT_PROVIDER_CLASS (e.g. "isolated"). Empty selects the
  # cluster default. gofer names a capability, never a substrate.
  providerClassName: gofer
  # gofer's runtime (agent) container image — the app brings it; the class stays
  # generic (a substrate binding, not app-specific).
  image: localhost/gofer-runtime:dev
  # ServiceAccounts in this namespace permitted to dispatch as gofer. The
  # controller TokenReviews the caller and rejects any SA not listed.
  dispatchers:
    - gofer
  identity:
    # The audience minted run credentials are bound to; must match AEI_AUDIENCE.
    audience: gofer-agent
    # The ceiling on scopes any run may request — gofer's runtime reads source
    # signals and writes only its own metadata (least privilege).
    maxScopes:
      - signals:read
      - metadata:write
