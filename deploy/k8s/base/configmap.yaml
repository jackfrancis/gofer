# Non-secret configuration for the web tier. Secrets (SESSION_SECRET, the OAuth
# client secret) and the verify-only run-credential public key (MINT_PUBLIC_KEY)
# live in the gofer-secrets Secret (see secret.example.yaml); `make dev-up` creates
# it imperatively.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gofer-config
  namespace: gofer
data:
  ADDR: ":8080"
  # The browser-facing base URL. For the dev port-forward this is localhost; the
  # GitHub OAuth callback is BASE_URL + /auth/github/callback.
  BASE_URL: "http://localhost:8080"
  # false because the dev port-forward is plain http; set true behind TLS.
  COOKIE_SECURE: "false"
  # Binds run credentials to the agent plane (ADR 0002); must match the AgentApp
  # spec.identity.audience. The AEI control plane stamps this on the token it mints.
  AEI_AUDIENCE: "gofer-agent"
  # The AEI dispatch API (the pre-installed aei-controller): gofer POSTs runs here
  # through the app SDK, authenticating with its projected ServiceAccount token.
  AEI_DISPATCH_ENDPOINT: "http://aei-controller.aei-system.svc:8080"
  # The AgentApp gofer dispatches as (must match the AgentApp metadata.name). The
  # control plane bounds every run by that app's policy and fixes the audience.
  AEI_APP: "gofer"
  # The in-cluster URL a runtime calls back to reach gofer's agent plane
  # (/agent/credential to vend the user's GitHub token, /agent/worklist to read and
  # write results). Distinct from BASE_URL: the runtime resolves gofer's Service,
  # not the browser port-forward.
  GOFER_SINK_URL: "http://gofer.gofer.svc.cluster.local:8080"
  # Chat model connections (OpenAI-compatible), non-secret. gofer BROKERS the token:
  # the web tier carries each connection's non-secret coordinates to a runtime as run
  # parameters (ai_endpoint, ai_model) and vends the shared token (AI_TOKEN, in
  # gofer-secrets) per run as provider "ai", so the sandbox never holds a standing
  # model secret. AI is enabled only when AI_CONNECTIONS and AI_TOKEN are both set.
  #
  # AI_CONNECTIONS is a JSON array of {endpoint, models} in priority order: element 0
  # is the default connection and each connection's models[0] is its default model.
  # Every connection shares AI_TOKEN (fanned out at load); connections carry no token.
  # Reorder the array to change the default. Example (one connection, two models):
  AI_CONNECTIONS: '[{"endpoint":"https://api.githubcopilot.com/chat/completions","models":["claude-opus-4.8","gpt-5.4"]}]'
