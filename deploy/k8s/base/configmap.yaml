# Non-secret configuration for the web tier. Secrets (SESSION_SECRET,
# VAULT_ENCRYPTION_KEY, the OAuth client secret) and the verify-only run-credential public key (MINT_PUBLIC_KEY)
# live in the gofer-secrets Secret (see secret.example.yaml); `make dev-up` creates
# it imperatively.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gofer-config
  namespace: gofer
data:
  ADDR: ":8080"
  # Where the web tier keeps its SQLite database (gofer.db): the mount path of the
  # StatefulSet's "data" volume. With DATA_DIR set, VAULT_ENCRYPTION_KEY (in
  # gofer-secrets) is required. Unset, state is in memory and lost on restart.
  DATA_DIR: "/var/lib/gofer"
  # The browser-facing base URL. For the dev port-forward this is localhost; the
  # GitHub OAuth callback is BASE_URL + /auth/github/callback.
  BASE_URL: "http://localhost:8080"
  # ALLOWED_GITHUB_LOGINS (comma-separated GitHub logins) restricts who may sign in;
  # deliberately absent here so a deploy never resets it. `make deploy
  # ALLOWED_GITHUB_LOGINS=you,colleague` writes it. Absent: any account may sign in.
  # GITHUB_CLIENT_KIND says what GITHUB_CLIENT_ID/SECRET name: "oauth-app" (the
  # default when absent; asks for read:user user:email) or "github-app" (a read-only
  # GitHub App used only for sign-in; expiring tokens refreshed by the web tier). Also
  # deliberately absent, so a deploy never flips it: set it on the live ConfigMap
  # together with the client secrets, then restart gofer-0 (ADR 0007, "Rollout").
  # REFRESH_INTERVAL (a Go duration, at least 1m, e.g. "15m") refreshes every
  # populated worklist from GitHub on that schedule; each refresh is a full ingest
  # run (GitHub walk, enrich, rank). With a chat model configured, each tick also
  # re-ranks discussions whose research is stale (one model call per such item).
  # Absent or "0" turns the schedule off, so
  # worklists refresh only on the Refresh button. Deliberately absent here: set it
  # on the live ConfigMap and restart gofer-0, and only once the cluster's AEI
  # contains provider failures (AEI archive-plan item 11), since scheduled runs
  # dispatch with nobody watching.
  # false because the dev port-forward is plain http; set true behind TLS.
  COOKIE_SECURE: "false"
  # Binds a run credential to gofer's agent plane; a runtime's token must carry this
  # audience to authenticate there.
  AGENT_AUDIENCE: "gofer-agent"
  # The selected agent-runtime backend's own configuration (internal/runtime/aei): the
  # AEI dispatch API (the pre-installed aei-controller's dispatch listener, port 8081,
  # apart from the runtime ABI and metrics on 8080), which gofer POSTs runs to through
  # the app SDK; the ServiceAccount token it authenticates with, projected for AEI's
  # "aei-dispatch" audience (the StatefulSet's aei-dispatch-token volume), from a pod
  # labelled agents.x-k8s.io/dispatch-client: "true" (AEI's NetworkPolicy admits
  # only those to the dispatch port); and the
  # AgentApp it dispatches as (must match the AgentApp metadata.name). The control
  # plane bounds every run by that app's policy and fixes the credential's audience.
  AEI_DISPATCH_ENDPOINT: "http://aei-controller.aei-system.svc:8081"
  AEI_DISPATCH_TOKEN_PATH: "/var/run/secrets/aei/token"
  AEI_APP: "gofer"
  # The in-cluster URL a runtime would call back to reach gofer's agent plane
  # (/agent/credential to vend the user's GitHub token, /agent/worklist to read and
  # write results). Distinct from BASE_URL: the runtime resolves gofer's Service,
  # not the browser port-forward.
  GOFER_SINK_URL: "http://gofer.gofer.svc.cluster.local:8080"
  # Chat model connections (OpenAI-compatible), non-secret. gofer BROKERS the token:
  # the web tier carries each connection's non-secret coordinates to a runtime as run
  # parameters (ai_endpoint, ai_model) and vends the shared token (AI_TOKEN, in
  # gofer-secrets) per run as provider "ai", so the sandbox never holds a standing
  # model secret. AI is enabled only when AI_CONNECTIONS and AI_TOKEN are both set.
  #
  # AI_CONNECTIONS is a JSON array of {endpoint, models} in priority order: element 0
  # is the default connection and each connection's models[0] is its default model.
  # Every connection shares AI_TOKEN (fanned out at load); connections carry no token.
  # Reorder the array to change the default. The endpoint PATH selects the API a
  # connection speaks: .../chat/completions or .../responses. A model listed under an
  # endpoint that does not serve it fails at call time, not at startup. Model ids go
  # stale; list the current ones with GET https://api.githubcopilot.com/models.
  AI_CONNECTIONS: '[{"endpoint":"https://api.githubcopilot.com/chat/completions","models":["claude-opus-5.5","gemini-4-carbon"]},{"endpoint":"https://api.githubcopilot.com/responses","models":["gpt-6.2-astra"]}]'
