# Example only — DO NOT commit real values. `make dev-up` creates this Secret
# imperatively: SESSION_SECRET and the Ed25519 keypair are generated (the public
# half lands here as MINT_PUBLIC_KEY; the private half is emitted for the AEI
# controller), and GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET are seeded from your
# shell env when set. To manage it declaratively instead, copy to secret.yaml, fill
# in real values, and add it to a kustomization (keep it out of git).
apiVersion: v1
kind: Secret
metadata:
  name: gofer-secrets
  namespace: gofer
type: Opaque
stringData:
  # >= 32 bytes, for the HMAC-signed session cookies (it no longer derives any mint
  # key — the web tier is verify-only, ADR 0002).
  SESSION_SECRET: "replace-with->=32-byte-random-string-0123456789"
  # The verify-only run-credential public key: base64(raw 32-byte Ed25519 public
  # key). The AEI control plane holds the matching private key and is the sole
  # minter; the web tier holds only this and can never mint (ADR 0002). Generate a
  # pair with `make genkey`. Not secret, but co-located here because dev-up creates
  # this Secret imperatively.
  MINT_PUBLIC_KEY: "base64-raw-ed25519-public-key"
  # GitHub OAuth app credentials (callback: BASE_URL + /auth/github/callback).
  GITHUB_CLIENT_ID: "your-github-oauth-client-id"
  GITHUB_CLIENT_SECRET: "your-github-oauth-client-secret"
  # The shared chat-model token, fanned out to every connection in AI_CONNECTIONS
  # (gofer-config). gofer is the model-token BROKER: the web tier holds it here and
  # vends it to a runtime per run (GET /agent/credential?provider=ai), carrying each
  # connection's non-secret coordinates (endpoint/model) as run parameters — so the
  # sandbox never holds a standing model secret. Endpoints conventionally serve many
  # models behind one credential, hence one shared token. Leave empty to disable the
  # model (runtimes then use the deterministic stub ranker).
  AI_TOKEN: "your-chat-model-token"
