# gofer's application base: the web tier and its config. The web tier runs standalone;
# any control-plane dependency comes with a concrete agent-runtime backend.
# secret.example.yaml is a template and is deliberately not listed (make dev-up creates
# the Secret).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
