# The identity the web StatefulSet runs as. No Kubernetes RBAC is bound to it: the web
# tier creates no per-run object and needs no Job/Pod privilege. The AEI backend
# authenticates its dispatch to the aei-controller with a token for this SA projected
# for the "aei-dispatch" audience (the StatefulSet's aei-dispatch-token volume); the
# default token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gofer
  namespace: gofer
