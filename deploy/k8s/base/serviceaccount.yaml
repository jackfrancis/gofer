# The identity the web Deployment runs as. Its projected token is what gofer
# presents to AEI when it dispatches a run (the AgentApp lists this SA under
# spec.dispatchers). No Kubernetes RBAC is bound to it: gofer creates no per-run
# object and needs no Job/Pod privilege — that lives with the AEI controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gofer
  namespace: gofer
