# gofer over HTTPS, applied only by `make deploy TLS_HOST=<name>` (see README, "HTTPS").
# Traefik terminates TLS with the certificate cert-manager obtains into gofer-tls, and
# forwards to the in-cluster gofer Service. __TLS_HOST__ is filled in at deploy time.
#
# The route is bound to the websecure (443) entrypoint only. Plain HTTP on port 80 is
# redirected to HTTPS by Traefik's entrypoint redirect, which runs at the lowest
# priority so cert-manager's challenge route (an Ingress of its own) still answers on
# port 80 while a certificate is issued or renewed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gofer
  namespace: gofer
  labels:
    app.kubernetes.io/name: gofer
  annotations:
    cert-manager.io/issuer: gofer-acme
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: gofer-gofer-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __TLS_HOST__
      secretName: gofer-tls
  rules:
    - host: __TLS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gofer
                port:
                  name: http
