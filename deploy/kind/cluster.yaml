# The gofer dev cluster topology for `make cluster-up`: a single node.
#
# The web tier is a single pod, so one node is plenty. A backend that fans out one pod
# per run may want a wider topology; point KIND_CONFIG at your own file for that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
